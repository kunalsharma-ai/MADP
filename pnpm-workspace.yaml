packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  argon2: true
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - lucide-react@1.78.0
overrides:
  # GHSA-w5hq-g745-h8pq: exceljs pulls in an old uuid. 11.1.1 is the patched release that still ships CommonJS.
  'uuid@<11.1.1': 11.1.1
